<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Squircle -->
    <radialGradient id="card_bg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#080C14" />
    </radialGradient>

    <!-- Glowing Rim Light Gradient -->
    <linearGradient id="rim_glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#0072FF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0.5" />
    </linearGradient>

    <!-- Primary Noksha Gradient -->
    <linearGradient id="noksha_grad" x1="15%" y1="90%" x2="85%" y2="10%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="35%" stop-color="#00C0FF" />
      <stop offset="70%" stop-color="#0072FF" />
      <stop offset="100%" stop-color="#004BFF" />
    </linearGradient>

    <!-- Speed Slash Cyan Gradient -->
    <linearGradient id="slash_cyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38E1FF" stop-opacity="1" />
    </linearGradient>

    <!-- Speed Slash Blue Gradient -->
    <linearGradient id="slash_blue" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0072FF" stop-opacity="1" />
      <stop offset="100%" stop-color="#004BFF" stop-opacity="0.8" />
    </linearGradient>

    <!-- Ambient Shadow Filter -->
    <filter id="app_shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.55" />
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#00F2FE" flood-opacity="0.18" />
    </filter>

    <!-- Emblem Glow -->
    <filter id="emblem_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Soft Shadow -->
  <rect x="24" y="24" width="464" height="464" rx="108" ry="108" 
        fill="url(#card_bg)" 
        stroke="url(#rim_glow)" 
        stroke-width="3" 
        filter="url(#app_shadow)" />

  <!-- Inner Soft Bevel -->
  <rect x="27" y="27" width="458" height="458" rx="105" ry="105" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="1" 
        stroke-opacity="0.08" />

  <!-- Centered Stylized 'N' Emblem -->
  <g transform="translate(2, 6) scale(0.92) translate(22, 18)">
    <!-- Ambient Energy Aura -->
    <path d="M 148 400 L 222 142 L 312 368 L 388 128" 
          fill="none" 
          stroke="url(#noksha_grad)" 
          stroke-width="52" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          opacity="0.38" 
          filter="url(#emblem_glow)" />

    <!-- Trailing Bottom-Left Speed Slashes -->
    <path d="M 108 436 L 126 376" stroke="url(#slash_cyan)" stroke-width="10" stroke-linecap="round" />
    <path d="M 92 422 L 104 382" stroke="url(#slash_cyan)" stroke-width="8" stroke-linecap="round" />
    <path d="M 124 456 L 138 412" stroke="url(#slash_cyan)" stroke-width="9" stroke-linecap="round" />

    <!-- Main Stylized 'N' Geometry -->
    <path d="M 136 406 L 226 138" 
          stroke="url(#noksha_grad)" 
          stroke-width="48" 
          stroke-linecap="round" />

    <path d="M 226 138 L 314 366 L 388 128" 
          fill="none" 
          stroke="url(#noksha_grad)" 
          stroke-width="48" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Leading Top-Right Speed Slashes -->
    <path d="M 398 114 L 420 54" stroke="url(#slash_blue)" stroke-width="11" stroke-linecap="round" />
    <path d="M 416 132 L 434 82" stroke="url(#slash_blue)" stroke-width="8" stroke-linecap="round" />
    <path d="M 382 92 L 398 48" stroke="url(#slash_blue)" stroke-width="9" stroke-linecap="round" />
  </g>
</svg>
