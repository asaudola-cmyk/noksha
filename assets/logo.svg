<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="100%" height="100%">
  <defs>
    <!-- Primary Noksha Gradient -->
    <linearGradient id="noksha_grad" x1="15%" y1="90%" x2="85%" y2="10%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="35%" stop-color="#00C0FF" />
      <stop offset="70%" stop-color="#0072FF" />
      <stop offset="100%" stop-color="#004BFF" />
    </linearGradient>

    <!-- Speed Slash Cyan Gradient -->
    <linearGradient id="slash_cyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38E1FF" stop-opacity="1" />
    </linearGradient>

    <!-- Speed Slash Blue Gradient -->
    <linearGradient id="slash_blue" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0072FF" stop-opacity="1" />
      <stop offset="100%" stop-color="#004BFF" stop-opacity="0.8" />
    </linearGradient>

    <!-- Ambient Cyan Glow -->
    <filter id="logo_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left: Stylized 'N' Emblem -->
  <g transform="translate(10, 10) scale(0.48)">
    <!-- Aura -->
    <path d="M 148 400 L 222 142 L 312 368 L 388 128" 
          fill="none" 
          stroke="url(#noksha_grad)" 
          stroke-width="54" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          opacity="0.32" 
          filter="url(#logo_glow)" />

    <!-- Trailing Bottom-Left Speed Slashes -->
    <path d="M 108 436 L 126 376" stroke="url(#slash_cyan)" stroke-width="11" stroke-linecap="round" />
    <path d="M 92 422 L 104 382" stroke="url(#slash_cyan)" stroke-width="9" stroke-linecap="round" />
    <path d="M 124 456 L 138 412" stroke="url(#slash_cyan)" stroke-width="10" stroke-linecap="round" />

    <!-- Main Geometry -->
    <path d="M 136 406 L 226 138" 
          stroke="url(#noksha_grad)" 
          stroke-width="50" 
          stroke-linecap="round" />

    <path d="M 226 138 L 314 366 L 388 128" 
          fill="none" 
          stroke="url(#noksha_grad)" 
          stroke-width="50" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Leading Top-Right Speed Slashes -->
    <path d="M 398 114 L 420 54" stroke="url(#slash_blue)" stroke-width="12" stroke-linecap="round" />
    <path d="M 416 132 L 434 82" stroke="url(#slash_blue)" stroke-width="9" stroke-linecap="round" />
    <path d="M 382 92 L 398 48" stroke="url(#slash_blue)" stroke-width="10" stroke-linecap="round" />
  </g>

  <!-- Right: Wordmark "NOKSHA" -->
  <text x="250" y="145" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="94" 
        font-weight="900" 
        letter-spacing="6px" 
        fill="#FFFFFF">NOKSHA</text>

  <!-- Subtitle: "UI/UX & FRONTEND FRAMEWORK" -->
  <text x="254" y="196" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="21" 
        font-weight="700" 
        letter-spacing="7.5px" 
        fill="#38BDF8" 
        opacity="0.92">UI/UX &amp; FRONTEND FRAMEWORK</text>
</svg>
